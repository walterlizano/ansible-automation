---
- name: Borgmatic
  become: true
  block:
    - name: Create borgmatic configuration folders
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ borgmatic_etc_dir }}"
        - "{{ borgmatic_snippets_dir }}"
        - "{{ borgmatic_ssh_dir }}"

    - name: Copy borg ssh keypair
      ansible.builtin.copy:
        content: "{{ borgmatic_ssh_private_key }}"
        dest: "{{ borgmatic_ssh_id }}"
        mode: "0400"

    - name: Create common.yaml snippet
      ansible.builtin.template:
        src: common.yaml.j2
        dest: "{{ borgmatic_snippets_common }}"
        mode: "0400"

    - name: Install borgmatic
      ansible.builtin.apt:
        pkg:
          - borgmatic

    - name: Install Borg backup Slack notification sender
      ansible.builtin.copy:
        src: notify-borg-backup.py
        dest: /usr/local/sbin/notify-borg-backup
        owner: root
        group: root
        mode: "0755"

    - name: Configure the Slack webhook for Borg notifications
      ansible.builtin.template:
        src: slack-notification.env.j2
        dest: "{{ borgmatic_slack_webhook_env_file }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Install the successful Borg backup notification service
      ansible.builtin.copy:
        src: borgmatic-notify.service
        dest: /etc/systemd/system/borgmatic-notify.service
        owner: root
        group: root
        mode: "0644"

    - name: Create Borgmatic service drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/borgmatic.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Notify Slack after a successful scheduled Borgmatic run
      ansible.builtin.copy:
        src: borgmatic-notification.conf
        dest: /etc/systemd/system/borgmatic.service.d/notification.conf
        owner: root
        group: root
        mode: "0644"

    - name: Make borgmatic timer drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/borgmatic.timer.d
        state: directory
        mode: "0755"

    # After the Google Drive sync, which starts at 1:00
    - name: Schedule borgmatic
      ansible.builtin.copy:
        content: |
          [Timer]
          OnCalendar=
          OnCalendar=*-*-* 4:00:00 America/Montreal
          RandomizedDelaySec=0
        dest: /etc/systemd/system/borgmatic.timer.d/schedule.conf
        mode: "0644"

    - name: Register borgmatic timer
      ansible.builtin.systemd:
        name: borgmatic.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: "Create backup folder on borg destinations"
      ansible.builtin.include_tasks:
        file: destination.yml
      vars:
        borgmatic_destination_hostname: "{{ item }}"
      loop: "{{ groups['backup_destinations'] }}"
