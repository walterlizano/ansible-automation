---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: libvirt

#    image_url: "https://cloud.debian.org/images/cloud/trixie/current/debian-13-genericcloud-amd64.qcow2"
platforms:

  - name: pi1
    image_url: "https://saimei.ftp.acc.umu.se/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
    memory_size: 2  # GB
    vcpu: 1
    disk_size: "16G"
    qemu_user: "libvirt-qemu"

  - name: srv1
    image_url: "https://saimei.ftp.acc.umu.se/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
    memory_size: 2  # GB
    vcpu: 1
    disk_size: "16G"
    qemu_user: "libvirt-qemu"

  - name: vps2
    image_url: "https://saimei.ftp.acc.umu.se/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
    memory_size: 2  # GB - bumped from 1: grafana+loki+alloy+prometheus stack OOMs the webserver VM at 1G
    vcpu: 1
    disk_size: "16G"
    qemu_user: "libvirt-qemu"


  - name: b72
    image_url: "https://saimei.ftp.acc.umu.se/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2"
    memory_size: 2  # GB
    vcpu: 1
    disk_size: "40G"  # the import holds the bundle and a copy of the 13 GB of attachments
    qemu_user: "libvirt-qemu"

provisioner:
  name: ansible
  config_options:
    defaults:
      vault_password_file: "${MOLECULE_PROJECT_DIRECTORY}/vault_password.sh"
  inventory:
    links:
      hosts: "${MOLECULE_PROJECT_DIRECTORY}/inventory/groups.yml"
      # Loaded through the root playbook on converge, but verify.yml lives in
      # molecule/default and only sees inventory variables
      group_vars: "${MOLECULE_PROJECT_DIRECTORY}/group_vars"

verifier:
  name: ansible
